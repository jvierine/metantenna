<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810"><rect width="1200" height="810" fill="white"/><g font-family="Arial, sans-serif"><text x="600" y="38" text-anchor="middle" font-size="27" fill="#203a46">Bias tee — power-input RFI filtering</text><text x="600" y="70" text-anchor="middle" font-size="18" fill="#8b512b">Implemented circuit · suppression requires bench verification</text><text x="92" y="146" text-anchor="middle" font-size="20" fill="#203a46">12 V supply</text><text x="92" y="191" text-anchor="middle" font-size="20" fill="#203a46">+</text><text x="112" y="271" text-anchor="end" font-size="18" fill="#203a46">Return</text><path d="M120,185 L230,185" stroke="#234b60" stroke-width="3" fill="none"/><path d="M120,265 L230,265" stroke="#234b60" stroke-width="3" fill="none"/><rect x="230" y="140" width="240" height="170" rx="8" fill="#eef5f7" stroke="#688592" stroke-width="2"/><text x="350.0" y="206.0" text-anchor="middle" font-size="19" fill="#203a46">CM1 · TDK ACM7060</text><text x="350.0" y="231.0" text-anchor="middle" font-size="19" fill="#203a46">Both +12 V and return</text><text x="350.0" y="256.0" text-anchor="middle" font-size="19" fill="#203a46">700 Ω at 100 MHz</text><path d="M470,185 L530,185" stroke="#234b60" stroke-width="3" fill="none"/><path d="M470,265 L1010,265" stroke="#234b60" stroke-width="3" fill="none"/><rect x="530" y="135" width="230" height="100" rx="8" fill="#eef5f7" stroke="#688592" stroke-width="2"/><text x="645.0" y="178.5" text-anchor="middle" font-size="19" fill="#203a46">F1 / D1 / D2 / C1</text><text x="645.0" y="203.5" text-anchor="middle" font-size="19" fill="#203a46">FB1 + C2/C3 + R1/C4</text><path d="M760,185 L860,185" stroke="#234b60" stroke-width="3" fill="none"/><rect x="800" y="330" width="120" height="80" rx="8" fill="#eef5f7" stroke="#688592" stroke-width="2"/><text x="860.0" y="363.5" text-anchor="middle" font-size="19" fill="#203a46">Bias choke</text><text x="860.0" y="388.5" text-anchor="middle" font-size="19" fill="#203a46">L10</text><path d="M860,185 L860,330" stroke="#234b60" stroke-width="3" fill="none"/><path d="M860,410 L860,465" stroke="#234b60" stroke-width="3" fill="none"/><path d="M860,465 L510,465" stroke="#234b60" stroke-width="3" fill="none"/><path d="M510,465 L510,510" stroke="#234b60" stroke-width="3" fill="none"/><circle cx="510" cy="510" r="5" fill="#234b60"/><path d="M1010,265 L1010,345" stroke="#234b60" stroke-width="3" fill="none"/><text x="1010" y="375" text-anchor="middle" font-size="18" fill="#203a46">RF ground</text><text x="1010" y="401" text-anchor="middle" font-size="18" fill="#203a46">Coax shields</text><text x="260" y="348" text-anchor="middle" font-size="18" fill="#203a46">Keep input return isolated</text><text x="260" y="375" text-anchor="middle" font-size="18" fill="#203a46">from RF ground until after the choke.</text><text x="140" y="485" text-anchor="middle" font-size="20" fill="#203a46">X antenna + DC</text><text x="1050" y="485" text-anchor="middle" font-size="20" fill="#203a46">X receiver</text><path d="M140,510 L677,510" stroke="#234b60" stroke-width="3" fill="none"/><path d="M677,494 L677,526" stroke="#234b60" stroke-width="3" fill="none"/><path d="M691,494 L691,526" stroke="#234b60" stroke-width="3" fill="none"/><path d="M691,510 L1060,510" stroke="#234b60" stroke-width="3" fill="none"/><text x="684" y="555" text-anchor="middle" font-size="18" fill="#203a46">C10 · DC block</text><text x="140" y="615" text-anchor="middle" font-size="20" fill="#203a46">Y antenna</text><text x="1050" y="615" text-anchor="middle" font-size="20" fill="#203a46">Y receiver</text><path d="M140,640 L677,640" stroke="#234b60" stroke-width="3" fill="none"/><path d="M677,624 L677,656" stroke="#234b60" stroke-width="3" fill="none"/><path d="M691,624 L691,656" stroke="#234b60" stroke-width="3" fill="none"/><path d="M691,640 L1060,640" stroke="#234b60" stroke-width="3" fill="none"/><text x="684" y="685" text-anchor="middle" font-size="18" fill="#203a46">C20 · DC block</text><text x="600" y="745" text-anchor="middle" font-size="18" fill="#203a46">RF return paths remain continuous. No series choke in the shared RF ground plane.</text><text x="600" y="777" text-anchor="middle" font-size="18" fill="#203a46">FB1: Murata 600 Ω at 100 MHz · C2: 1 nF · C3: 100 nF · R1/C4: 1 Ω + 10 µF</text></g></svg>
