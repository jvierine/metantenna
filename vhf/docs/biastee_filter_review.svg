<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950"><rect width="1200" height="950" fill="white"/><g font-family="Arial, sans-serif"><text x="600" y="38" text-anchor="middle" font-size="27" fill="#203a46">Bias tee — power-input RFI filtering</text><text x="600" y="70" text-anchor="middle" font-size="18" fill="#8b512b">Implemented circuit · suppression requires bench verification</text><text x="92" y="146" text-anchor="middle" font-size="20" fill="#203a46">12 V supply</text><text x="92" y="191" text-anchor="middle" font-size="20" fill="#203a46">+</text><text x="112" y="271" text-anchor="end" font-size="18" fill="#203a46">Return</text><path d="M120,185 L230,185" stroke="#234b60" stroke-width="3" fill="none"/><path d="M120,265 L230,265" stroke="#234b60" stroke-width="3" fill="none"/><rect x="145" y="170" width="60" height="30" rx="8" fill="white" stroke="#688592" stroke-width="2"/><text x="175.0" y="191.0" text-anchor="middle" font-size="19" fill="#203a46">F1</text><rect x="230" y="140" width="240" height="170" rx="8" fill="#eef5f7" stroke="#688592" stroke-width="2"/><text x="350.0" y="206.0" text-anchor="middle" font-size="19" fill="#203a46">CM1 · TDK ACM7060</text><text x="350.0" y="231.0" text-anchor="middle" font-size="19" fill="#203a46">Both +12 V and return</text><text x="350.0" y="256.0" text-anchor="middle" font-size="19" fill="#203a46">700 Ω at 100 MHz</text><path d="M470,185 L530,185" stroke="#234b60" stroke-width="3" fill="none"/><path d="M470,265 L1010,265" stroke="#234b60" stroke-width="3" fill="none"/><rect x="530" y="135" width="230" height="100" rx="8" fill="#eef5f7" stroke="#688592" stroke-width="2"/><text x="645.0" y="178.5" text-anchor="middle" font-size="19" fill="#203a46">D1 / D2 / C1</text><text x="645.0" y="203.5" text-anchor="middle" font-size="19" fill="#203a46">FB1 + C2/C3 + R1/C4</text><path d="M760,185 L860,185" stroke="#234b60" stroke-width="3" fill="none"/><rect x="800" y="330" width="120" height="80" rx="8" fill="#eef5f7" stroke="#688592" stroke-width="2"/><text x="860.0" y="363.5" text-anchor="middle" font-size="19" fill="#203a46">F10 + L10</text><text x="860.0" y="388.5" text-anchor="middle" font-size="19" fill="#203a46">DC injection</text><path d="M860,185 L860,330" stroke="#234b60" stroke-width="3" fill="none"/><path d="M860,410 L860,465" stroke="#234b60" stroke-width="3" fill="none"/><path d="M860,465 L650,465" stroke="#234b60" stroke-width="3" fill="none"/><path d="M650,465 L650,510" stroke="#234b60" stroke-width="3" fill="none"/><circle cx="650" cy="510" r="5" fill="#234b60"/><path d="M1010,265 L1010,345" stroke="#234b60" stroke-width="3" fill="none"/><text x="1010" y="375" text-anchor="middle" font-size="18" fill="#203a46">RF ground</text><text x="1010" y="401" text-anchor="middle" font-size="18" fill="#203a46">Coax shields</text><text x="260" y="348" text-anchor="middle" font-size="18" fill="#203a46">Keep input return isolated</text><text x="260" y="375" text-anchor="middle" font-size="18" fill="#203a46">from RF ground until after the choke.</text><text x="140" y="485" text-anchor="middle" font-size="20" fill="#203a46">X antenna + DC</text><text x="1040" y="485" text-anchor="middle" font-size="20" fill="#203a46">X receiver</text><path d="M140,510 L300,510" stroke="#234b60" stroke-width="3" fill="none"/><path d="M140,570 L300,570" stroke="#234b60" stroke-width="3" fill="none"/><rect x="300" y="485" width="185" height="115" rx="8" fill="#eef5f7" stroke="#688592" stroke-width="2"/><text x="392.5" y="536.0" text-anchor="middle" font-size="19" fill="#203a46">CM10</text><text x="392.5" y="561.0" text-anchor="middle" font-size="19" fill="#203a46">Centre + shield</text><path d="M485,510 L795,510" stroke="#234b60" stroke-width="3" fill="none"/><path d="M795,494 L795,526" stroke="#234b60" stroke-width="3" fill="none"/><path d="M809,494 L809,526" stroke="#234b60" stroke-width="3" fill="none"/><path d="M809,510 L1060,510" stroke="#234b60" stroke-width="3" fill="none"/><text x="802" y="545" text-anchor="middle" font-size="17" fill="#203a46">C10 · DC block</text><path d="M485,570 L1060,570" stroke="#234b60" stroke-width="3" fill="none"/><text x="1040" y="600" text-anchor="middle" font-size="17" fill="#203a46">Indoor RF ground</text><text x="140" y="705" text-anchor="middle" font-size="20" fill="#203a46">Y antenna</text><text x="1040" y="705" text-anchor="middle" font-size="20" fill="#203a46">Y receiver</text><path d="M140,730 L300,730" stroke="#234b60" stroke-width="3" fill="none"/><path d="M140,790 L300,790" stroke="#234b60" stroke-width="3" fill="none"/><rect x="300" y="705" width="185" height="115" rx="8" fill="#eef5f7" stroke="#688592" stroke-width="2"/><text x="392.5" y="756.0" text-anchor="middle" font-size="19" fill="#203a46">CM20</text><text x="392.5" y="781.0" text-anchor="middle" font-size="19" fill="#203a46">Centre + shield</text><path d="M485,730 L795,730" stroke="#234b60" stroke-width="3" fill="none"/><path d="M795,714 L795,746" stroke="#234b60" stroke-width="3" fill="none"/><path d="M809,714 L809,746" stroke="#234b60" stroke-width="3" fill="none"/><path d="M809,730 L1060,730" stroke="#234b60" stroke-width="3" fill="none"/><text x="802" y="765" text-anchor="middle" font-size="17" fill="#203a46">C20 · DC block</text><path d="M485,790 L795,790" stroke="#234b60" stroke-width="3" fill="none"/><path d="M795,774 L795,806" stroke="#234b60" stroke-width="3" fill="none"/><path d="M809,774 L809,806" stroke="#234b60" stroke-width="3" fill="none"/><path d="M809,790 L1060,790" stroke="#234b60" stroke-width="3" fill="none"/><text x="802" y="836" text-anchor="middle" font-size="17" fill="#203a46">C21 · prevents a parallel DC return</text><text x="1040" y="820" text-anchor="middle" font-size="17" fill="#203a46">Indoor RF ground</text><text x="600" y="890" text-anchor="middle" font-size="17" fill="#203a46">Antenna-side shield islands stay separate from indoor ground except through the paired windings.</text><text x="600" y="920" text-anchor="middle" font-size="17" fill="#203a46">CM10 / CM20: TDK ACM4520-901-2P-T000 · JLC C41519 · factory-mounted SMD components</text></g></svg>
